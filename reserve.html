<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>莠育ｴ・☆繧・| 縺ｲ縺縺｣縺田afe</title>

  <link rel="stylesheet" href="./style.css?v=20260206_03" />

  <!-- flatpickr・医き繝ｬ繝ｳ繝繝ｼUI・・-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    .flatpickr-calendar{ border-radius:16px; box-shadow: 0 12px 30px rgba(0,0,0,.15); }
    .peopleSplit{ display:flex; gap:12px; flex-wrap:wrap; width:100%; }
    .peopleBox{ flex:1 1 140px; min-width:140px; display:flex; flex-direction:column; gap:6px; }
    .peopleBox label{ font-weight:800; color:#6b7280; font-size:13px; }
    .peopleBox input{ width:100%; }
      @media (max-width: 480px){
      .peopleSplit{ flex-direction: column; }
      .peopleBox{ min-width: 0; }
    }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html">縺ｲ縺縺｣縺田afe 莠育ｴ・/a>
  </header>

  <main class="container">
    <h1>莠育ｴ・☆繧・/h1>

    <section class="card">
      <div class="row">
        <label for="date">譌･莉・/label>
        <input id="date" type="text" placeholder="譌･莉倥ｒ驕ｸ謚・ required />
      </div>

      <div class="row">
        <label>蟶ｭ縺ｮ蟶梧悍</label>
        <select id="seatPref">
          <option value="either">縺ｩ縺｡繧峨〒繧・/option>
          <option value="counter">繧ｫ繧ｦ繝ｳ繧ｿ繝ｼ縺ｮ縺ｿ</option>
          <option value="table">繝・・繝悶Ν蟶梧悍</option>
          <option value="zashiki">蠎ｧ謨ｷ蟶梧悍</option>
        </select>
      </div>

      <div class="row">
        <label>譎る俣</label>
        <select id="time" required></select>
        <small id="timeHelp" class="muted"></small>
      </div>

            <div class="row">
        <label>莠ｺ謨ｰ</label>
        <div class="peopleSplit">
          <div class="peopleBox">
            <label for="adult">螟ｧ莠ｺ</label>
            <input id="adult" type="number" min="1" max="20" value="2" required />
          </div>
          <div class="peopleBox">
            <label for="child">蟄蝉ｾ・/label>
            <input id="child" type="number" min="0" max="20" value="0" required />
          </div>
        </div>
      </div>

      <div class="row">
        <label>縺雁錐蜑・/label>
        <input id="name" type="text" placeholder="萓具ｼ壼ｱｱ逕ｰ 螟ｪ驛・ required />
      </div>

      <div class="row">
        <label>髮ｻ隧ｱ逡ｪ蜿ｷ</label>
        <input id="phone" type="tel" placeholder="萓具ｼ・9012345678・医ワ繧､繝輔Φ蜿ｯ・・ required />
      </div>

      <div class="row">
        <label>蛯呵・/label>
        <textarea id="note" rows="3" placeholder="繧｢繝ｬ繝ｫ繧ｮ繝ｼ縺ｪ縺ｩ・井ｻｻ諢擾ｼ・></textarea>
      </div>

      <div class="actions">
        <button id="submit" class="primary" type="button">縺薙・蜀・ｮｹ縺ｧ騾∽ｿ｡</button>
      </div>

      <p class="muted" style="margin-top:10px;">
        窶ｻ 莠育ｴ・・縲梧価隱榊ｾ・■・井ｻｮ莠育ｴ・ｼ峨阪〒蜿嶺ｻ倥＠縺ｾ縺吶よ価隱榊ｾ後↓遒ｺ螳夐夂衍縺悟ｱ翫″縺ｾ縺吶・br>
        窶ｻ 蝨滓律縺ｯ莨代∩縺ｮ縺溘ａ莠育ｴ・〒縺阪∪縺帙ｓ縲・br>
        窶ｻ 繧ｭ繝｣繝ｳ繧ｻ繝ｫ縺ｯ縺企崕隧ｱ縺ｧ縺企｡倥＞縺励∪縺吶・      </p>
    </section>

    <p><a href="./availability.html">遨ｺ蟶ｭ迥ｶ豕√ｒ隕九ｋ</a> / <a href="./manage.html">莠育ｴ・・遒ｺ隱阪・螟画峩</a></p>
  </main>

  <script src="./app.js?v=20260129"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script>
    const $date = document.getElementById("date");
    const $seatPref = document.getElementById("seatPref");
    const $time = document.getElementById("time");
    const $timeHelp = document.getElementById("timeHelp");
    const $adult = document.getElementById("adult");
    const $child = document.getElementById("child");
    const $name = document.getElementById("name");
    const $phone = document.getElementById("phone");
    const $note = document.getElementById("note");
    const $submit = document.getElementById("submit");

    let availability = null;
    let fp = null; // flatpickr instance

    function normalizePhone(s) {
      return String(s || "").replace(/[^\d]/g, "");
    }
    function nInt(v, fallback=0) {
      const x = Number.parseInt(String(v ?? "").trim(), 10);
      return Number.isFinite(x) ? x : fallback;
    }
    function clampPeopleInputs() {
      let a = nInt($adult.value, 1);
      let c = nInt($child.value, 0);

      a = Math.max(1, Math.min(20, a));
      c = Math.max(0, Math.min(20, c));

      // 蜷郁ｨ医・ 20 縺ｾ縺ｧ・域立 people 縺ｨ莠呈鋤・・      if (a + c > 20) c = Math.max(0, 20 - a);

      $adult.value = String(a);
      $child.value = String(c);
      return { adults: a, children: c, total: a + c };
    }
    function totalPeople() {
      return clampPeopleInputs().total;
    }
    function jstTodayYmd() {
      const nowJst = new Date(Date.now() + 9*60*60*1000);
      return nowJst.toISOString().slice(0,10);
    }
    function isWeekendDateObj(d) {
      const w = d.getDay(); // 0 Sun, 6 Sat
      return w === 0 || w === 6;
    }
    function isWeekendYmd(ymd) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd || ""))) return false;
      const [y,m,d] = ymd.split("-").map(Number);
      const day = new Date(Date.UTC(y, m-1, d)).getUTCDay();
      return day === 0 || day === 6;
    }
    function nextWeekdayYmd(ymd) {
      const [y,m,d] = ymd.split("-").map(Number);
      let t = Date.UTC(y, m-1, d);
      while (true) {
        const day = new Date(t).getUTCDay();
        if (day !== 0 && day !== 6) break;
        t += 24*60*60*1000;
      }
      return new Date(t).toISOString().slice(0,10);
    }

    // ====== 蟶ｭ縺ｮ蜿ｯ蜷ｦ蛻､螳夲ｼ域焚蟄励・蜃ｺ縺輔★縲御ｺ育ｴ・庄/貅蟶ｭ縲搾ｼ・=====
    function canZashiki(sl) {
      const z = sl.zashikiEnabled ? Number(sl.zashikiRemain || 0) : 0;
      return !!sl.zashikiEnabled && z > 0;
    }
    function canCounter(sl) {
      return Number(sl.counterRemain || 0) > 0;
    }
    function canTable(people, sl) {
      const p = Number(people || 1);
      const t2 = Number(sl.table2Remain || 0);
      const tl = Number(sl.tableLargeRemain || 0);
      const z = sl.zashikiEnabled ? Number(sl.zashikiRemain || 0) : 0;

      if (p <= 2) return (t2 > 0) || (tl > 0);
      if (p <= 6) return (tl > 0);
      return !!sl.zashikiEnabled && z > 0; // 7+ 縺ｯ蠎ｧ謨ｷ縺ｸ
    }
    function canEither(people, sl) {
      const p = Number(people || 1);

      const can = {
        counter: canCounter(sl),
        table2: Number(sl.table2Remain || 0) > 0,
        tableLarge: Number(sl.tableLargeRemain || 0) > 0,
        zashiki: canZashiki(sl),
      };

      const order =
        p <= 2 ? ["table2","counter","tableLarge","zashiki"]
        : p <= 6 ? ["tableLarge","zashiki","counter","table2"]
        : ["zashiki","tableLarge","counter","table2"];

      for (const t of order) {
        if (t === "zashiki" && !sl.zashikiEnabled) continue;
        if (can[t]) return true;
      }
      return false;
    }
    function slotDisabled(sl) {
      const pref = $seatPref.value;
      const p = totalPeople();

      if (pref === "counter") return !canCounter(sl);
      if (pref === "zashiki") return !canZashiki(sl);
      if (pref === "table")   return !canTable(p, sl);
      return !canEither(p, sl);
    }
    function slotLabel(sl) {
      const pref = $seatPref.value;
      const p = totalPeople();

      let ok = false;
      if (pref === "counter") ok = canCounter(sl);
      else if (pref === "zashiki") ok = canZashiki(sl);
      else if (pref === "table") ok = canTable(p, sl);
      else ok = canEither(p, sl);

      if (pref === "zashiki" && !sl.zashikiEnabled) return `${sl.time}・亥ｺｧ謨ｷ・壼女莉伜●豁｢・荏;
      return `${sl.time}・・{ok ? "莠育ｴ・庄" : "貅蟶ｭ"}・荏;
    }

    function renderTimes() {
      $time.innerHTML = "";

      if (!availability) {
        const opt = document.createElement("option");
        opt.textContent = "隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ窶ｦ";
        $time.appendChild(opt);
        return;
      }

      if (availability.closed) {
        $timeHelp.textContent = availability.reason || "莨第･ｭ譌･縺ｮ縺溘ａ莠育ｴ・〒縺阪∪縺帙ｓ縲・;
        $submit.disabled = true;
        $time.disabled = true;
        return;
      }

      $time.disabled = false;

      let enabledCount = 0;
      for (const sl of (availability.slots || [])) {
        const opt = document.createElement("option");
        opt.value = sl.time;
        opt.textContent = slotLabel(sl);
        opt.disabled = slotDisabled(sl);
        if (!opt.disabled) enabledCount++;
        $time.appendChild(opt);
      }

      if (enabledCount === 0) {
        $timeHelp.textContent = "縺薙・譚｡莉ｶ縺ｧ縺ｯ貅蟶ｭ縺ｧ縺吶よ律莉倥・莠ｺ謨ｰ繝ｻ蟶ｭ蟶梧悍繧貞､峨∴縺ｦ縺上□縺輔＞縲・;
        $submit.disabled = true;
      } else {
        $timeHelp.textContent = "";
        $submit.disabled = false;

        const curOpt = [...$time.options].find(o => o.value === $time.value);
        if (!curOpt || curOpt.disabled) {
          const firstEnabled = [...$time.options].find(o => !o.disabled);
          if (firstEnabled) $time.value = firstEnabled.value;
        }
      }
    }

    async function loadAvailability() {
      const ymd = $date.value;

      // 蠢ｵ謚ｼ縺暦ｼ壼悄譌･縺梧擂縺溘ｉ蟷ｳ譌･縺ｫ謌ｻ縺呻ｼ・latpickr縺ｧ蝓ｺ譛ｬ縺ｯ驕ｸ縺ｹ縺ｪ縺・′菫晞匱・・      if (isWeekendYmd(ymd)) {
        alert("蝨滓律縺ｯ莨代∩縺ｧ縺吶ょｹｳ譌･繧帝∈繧薙〒縺上□縺輔＞縲・);
        const fixed = nextWeekdayYmd(ymd);
        if (fp) fp.setDate(fixed, true); // onChange縺ｧ蜀阪Ο繝ｼ繝・        else $date.value = fixed;
        return;
      }

      $timeHelp.textContent = "隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ窶ｦ";
      $submit.disabled = true;
      availability = null;
      renderTimes();

      try {
        availability = await Hidakko.api(`/availability?date=${encodeURIComponent($date.value)}`);
        renderTimes();
      } catch (e) {
        console.error(e);
        availability = null;
        $timeHelp.textContent = "遨ｺ蟶ｭ迥ｶ豕√・蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆縲・;
        $submit.disabled = true;
        renderTimes();
      }
    }

    $seatPref.addEventListener("change", renderTimes);
    $adult.addEventListener("input", () => { clampPeopleInputs(); renderTimes(); });
    $child.addEventListener("input", () => { clampPeopleInputs(); renderTimes(); });
    $adult.addEventListener("change", () => { clampPeopleInputs(); renderTimes(); });
    $child.addEventListener("change", () => { clampPeopleInputs(); renderTimes(); });

    $submit.addEventListener("click", async () => {
      if (isWeekendYmd($date.value)) {
        alert("蝨滓律縺ｯ莨代∩縺ｧ縺吶ょｹｳ譌･繧帝∈繧薙〒縺上□縺輔＞縲・);
        return;
      }

      if (!$date.value) { alert("譌･莉倥ｒ驕ｸ繧薙〒縺上□縺輔＞縲・); return; }
      if (!$time.value) { alert("譎る俣繧帝∈繧薙〒縺上□縺輔＞縲・); return; }

      const pc = clampPeopleInputs();
      if (pc.adults < 1) { alert("螟ｧ莠ｺ縺ｯ1莉･荳翫〒蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }
      if (pc.children < 0) { alert("蟄蝉ｾ帙・0莉･荳翫〒蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }
      if (pc.total < 1) { alert("莠ｺ謨ｰ繧貞・蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }

      const nm = ($name.value || "").trim();
      const ph = normalizePhone($phone.value);

      if (!nm) { alert("縺雁錐蜑阪ｒ蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }
      if (!ph) { alert("髮ｻ隧ｱ逡ｪ蜿ｷ繧貞・蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }

      $submit.disabled = true;
      $submit.textContent = "騾∽ｿ｡荳ｭ窶ｦ";

      try {
        // 笘・∽ｿ｡逶ｴ蜑阪↓譛譁ｰ縺ｮ遨ｺ蟶ｭ迥ｶ豕√ｒ蜿悶ｊ逶ｴ縺呻ｼ育峩蜑阪↓蝓九∪縺｣縺滓棧縺ｸ縺ｮ莠育ｴ・ｒ髦ｲ縺撰ｼ・        const wantedTime = $time.value;
        try {
          const latest = await Hidakko.api(`/availability?date=${encodeURIComponent($date.value)}`);
          availability = latest;
          renderTimes();

          if (latest && latest.closed) {
            alert(latest.reason || "莨第･ｭ譌･縺ｮ縺溘ａ莠育ｴ・〒縺阪∪縺帙ｓ縲・);
            return;
          }

          const sl = (latest && latest.slots || []).find(x => x.time === wantedTime);
          if (!sl || slotDisabled(sl)) {
            alert("縺吶∩縺ｾ縺帙ｓ縲ゆｻ企∈繧薙〒縺・ｋ譎る俣縺ｯ貅蟶ｭ縺ｫ縺ｪ繧翫∪縺励◆縲ょ挨縺ｮ譎る俣繧帝∈縺ｳ逶ｴ縺励※縺上□縺輔＞縲・);
            return;
          }

          // 縺ｾ縺遨ｺ縺・※縺・ｋ縺ｪ繧蛾∈謚槭ｒ謌ｻ縺励※邯夊｡・          $time.value = wantedTime;
        } catch (e) {
          // 蜿門ｾ励〒縺阪↑縺・ｴ蜷医・螳牙・蛛ｴ・磯∽ｿ｡縺励↑縺・ｼ・          console.error(e);
          alert("遨ｺ蟶ｭ迥ｶ豕√・蜀咲｢ｺ隱阪↓螟ｱ謨励＠縺ｾ縺励◆縲ょｰ代＠蠕・▲縺ｦ縺九ｉ繧ゅ≧荳蠎ｦ縺願ｩｦ縺励￥縺縺輔＞縲・);
          return;
        }

        const lineUserId = await tryGetLineUserId(); // app.js

        const payload = {
          date: $date.value,
          time: $time.value,
          people: totalPeople(),
          adults: clampPeopleInputs().adults,
          children: clampPeopleInputs().children,
          seatPref: $seatPref.value,
          name: nm,
          phone: $phone.value, // 繧ｵ繝ｼ繝仙・縺ｧ豁｣隕丞喧縺輔ｌ繧九り｡ｨ遉ｺ逕ｨ縺ｫ蜈･蜉帛､繧０K
          note: $note.value,
          lineUserId: lineUserId || null,
        };

        const r = await Hidakko.api("/reservations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // 笘・眠莉墓ｧ假ｼ喞ode 繧貞━蜈医よ立莠呈鋤縺ｧ id 縺ｧ繧ょ虚縺上ｈ縺・ｿ晞匱縲・        const code = (r && (r.code || r.id) || "").toString();
        location.href = `./done.html?code=${encodeURIComponent(code)}`;
      } catch (e) {
        console.error(e);
        alert(e.message || "騾∽ｿ｡縺ｫ螟ｱ謨励＠縺ｾ縺励◆");
      } finally {
        $submit.disabled = false;
        $submit.textContent = "縺薙・蜀・ｮｹ縺ｧ騾∽ｿ｡";
      }
    });

    // ====== flatpickr 蛻晄悄蛹厄ｼ医き繝ｬ繝ｳ繝繝ｼ陦ｨ遉ｺ・句悄譌･辟｡蜉ｹ・・=====
    (function initDatePicker(){
      const today = jstTodayYmd();
      const initial = isWeekendYmd(today) ? nextWeekdayYmd(today) : today;

      fp = flatpickr($date, {
        dateFormat: "Y-m-d",
        defaultDate: initial,
        minDate: "today",
        disable: [ function(date){ return isWeekendDateObj(date); } ], // 蝨滓律辟｡蜉ｹ
        onChange: function() { loadAvailability(); }
      });
    })();

    // init
    renderTimes();
    loadAvailability();
  </script>
</body>
</html>
