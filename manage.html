  <link rel="stylesheet" href="./style.css?v=20260206_05" />

  <!-- flatpickr・医き繝ｬ繝ｳ繝繝ｼUI・・-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<body>
  <header class="topbar">
    <a class="brand" href="./index.html">縺ｲ縺縺｣縺田afe 莠育ｴ・/a>
  </header>

  <main class="container">
    <h1>莠育ｴ・・遒ｺ隱阪・螟画峩</h1>

    <section class="card">
      <h2 style="margin-top:0;">莠育ｴ・ｒ髢九￥</h2>

      <div class="row">
        <label>莠育ｴ・分蜿ｷ</label>
        <input id="rid" type="text" placeholder="萓具ｼ・23456・・譯・ｼ・ />
      </div>

      <div class="row">
        <label>髮ｻ隧ｱ逡ｪ蜿ｷ</label>
        <input id="phone" type="tel" placeholder="莠育ｴ・凾縺ｮ髮ｻ隧ｱ逡ｪ蜿ｷ・医ワ繧､繝輔Φ蜿ｯ・・ />
      </div>

      <div class="actions">
        <button id="lookup" class="primary" type="button">遒ｺ隱・/button>

      <p class="muted">窶ｻ 繧ｭ繝｣繝ｳ繧ｻ繝ｫ縺ｯ縺企崕隧ｱ縺ｧ縺企｡倥＞縺励∪縺吶・/p>
    </section>

    <section id="detail" class="card" style="display:none;">
      <h2 style="margin-top:0;">莠育ｴ・・螳ｹ</h2>

      <div id="statusBox" class="notice"></div>

      <div class="row">
        <label for="date">譌･莉・/label>

      <div class="row">
        <label>蟶ｭ縺ｮ蟶梧悍</label>
        <select id="seatPref">
          <option value="either">縺ｩ縺｡繧峨〒繧・/option>
          <option value="counter">繧ｫ繧ｦ繝ｳ繧ｿ繝ｼ縺ｮ縺ｿ</option>
          <option value="table">繝・・繝悶Ν蟶梧悍</option>
          <option value="zashiki">蠎ｧ謨ｷ蟶梧悍</option>
        </select>
      </div>

      <div class="row">
        <label>譎る俣</label>
        <select id="time" required></select>
        <small id="timeHelp" class="muted"></small>
      </div>

            <div class="row">
        <label>莠ｺ謨ｰ</label>
        <div class="peopleSplit">
          <div class="peopleBox">
            <label for="adult">螟ｧ莠ｺ</label>
            <input id="adult" type="number" min="1" max="20" required />
          </div>
          <div class="peopleBox">
            <label for="child">蟄蝉ｾ・/label>
            <input id="child" type="number" min="0" max="20" required />
          </div>
        </div>
      </div>

      <div class="row">
        <label>蛯呵・/label>
        <textarea id="note" rows="3"></textarea>
      </div>

      <div class="actions">
        <button id="update" class="primary" type="button">螟画峩繧帝∽ｿ｡・亥・謇ｿ隱搾ｼ・/button>
        <a class="btn" href="./index.html">繝医ャ繝励∈謌ｻ繧・/a>
      </div>

      <p class="muted">
        窶ｻ 螟画峩縺ｯ<strong>2譌･蜑阪∪縺ｧ</strong>蜿ｯ閭ｽ縺ｧ縺吶・br>
        窶ｻ 蝨滓律縺ｯ莨代∩縺ｮ縺溘ａ莠育ｴ・〒縺阪∪縺帙ｓ縲・br>
        窶ｻ 繧ｭ繝｣繝ｳ繧ｻ繝ｫ縺ｯ縺企崕隧ｱ縺ｧ縺企｡倥＞縺励∪縺吶・      </p>
    </section>
  </main>

  <script src="./app.js?v=20260129"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    const $rid = document.getElementById("rid");
    const $phone = document.getElementById("phone");
    const $lookup = document.getElementById("lookup");

    const $detail = document.getElementById("detail");
    const $statusBox = document.getElementById("statusBox");
    const $date = document.getElementById("date");
    const $seatPref = document.getElementById("seatPref");
    const $time = document.getElementById("time");
    const $timeHelp = document.getElementById("timeHelp");
    const $adult = document.getElementById("adult");
    const $child = document.getElementById("child");
    const $note = document.getElementById("note");
    const $update = document.getElementById("update");

    let currentReservation = null;
    let availability = null;
    let fp = null; // flatpickr instance
    let deadlineLocked = false;

    function normalizePhone(s) {
      return String(s || "").replace(/[^\d]/g, "");
    }
    function nInt(v, fallback=0) {
      const x = Number.parseInt(String(v ?? "").trim(), 10);
      return Number.isFinite(x) ? x : fallback;
    }
    function clampPeopleInputs() {
      let a = nInt($adult.value, 1);
      let c = nInt($child.value, 0);

      a = Math.max(1, Math.min(20, a));
      c = Math.max(0, Math.min(20, c));

      if (a + c > 20) c = Math.max(0, 20 - a);

      $adult.value = String(a);
      $child.value = String(c);
      return { adults: a, children: c, total: a + c };
    }
    function totalPeople() {
      return clampPeopleInputs().total;
    }
    function jstTodayYmd() {
      const nowJst = new Date(Date.now() + 9*60*60*1000);
      return nowJst.toISOString().slice(0,10);
    }
    function daysDiff(fromYmd, toYmd) {
      const a = new Date(fromYmd + "T00:00:00Z");
      const b = new Date(toYmd + "T00:00:00Z");
      return Math.floor((b - a) / (24*60*60*1000));
    }
    function canChange(ymd) {
      return daysDiff(jstTodayYmd(), ymd) >= 2;
    }

    function isWeekendDateObj(d) {
      const w = d.getDay(); // 0 Sun, 6 Sat
      return w === 0 || w === 6;
    }
    function isWeekendYmd(ymd) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd || ""))) return false;
      const [y,m,d] = ymd.split("-").map(Number);
      const day = new Date(Date.UTC(y, m-1, d)).getUTCDay();
      return day === 0 || day === 6;
    }
    function nextWeekdayYmd(ymd) {
      const [y,m,d] = ymd.split("-").map(Number);
      let t = Date.UTC(y, m-1, d);
      while (true) {
        const day = new Date(t).getUTCDay();
        if (day !== 0 && day !== 6) break;
        t += 24*60*60*1000;
      }
      return new Date(t).toISOString().slice(0,10);
    }

    function setEditable(enabled) {
      $date.disabled = !enabled;
      $seatPref.disabled = !enabled;
      $time.disabled = !enabled;
      $adult.disabled = !enabled;
       $child.disabled = !enabled;
      $note.disabled = !enabled;
      $update.disabled = !enabled;
      if (!enabled) $update.title = "螟画峩縺ｯ2譌･蜑阪∪縺ｧ蜿ｯ閭ｽ縺ｧ縺・;
      else $update.title = "";
    }

    function statusText(r) {
      const s = r.status;
      if (s === "pending") return "迥ｶ諷具ｼ壽価隱榊ｾ・■・井ｻｮ莠育ｴ・ｼ・;
      if (s === "confirmed") {
        const seat =
          r.seatType === "zashiki" ? "蠎ｧ謨ｷ" :
          (r.seatType === "counter" ? "繧ｫ繧ｦ繝ｳ繧ｿ繝ｼ" :
          (r.seatType === "table2" ? "繝・・繝悶Ν・・莠ｺ・・ :
          (r.seatType === "tableLarge" ? "繝・・繝悶Ν・・縲・・・ : "譛ｪ遒ｺ螳・)));
        return `迥ｶ諷具ｼ夂｢ｺ螳夲ｼ亥ｸｭ・・{seat}・荏;
      }
      if (s === "rejected") return "迥ｶ諷具ｼ壹♀譁ｭ繧・;
      if (s === "canceled") return "迥ｶ諷具ｼ壹く繝｣繝ｳ繧ｻ繝ｫ";
      return `迥ｶ諷具ｼ・{s}`;
    }

    // ====== 蟶ｭ縺ｮ蜿ｯ蜷ｦ蛻､螳夲ｼ域焚蟄励・蜃ｺ縺輔★縲御ｺ育ｴ・庄/貅蟶ｭ縲搾ｼ・=====
    function canZashiki(sl) {
      const z = sl.zashikiEnabled ? Number(sl.zashikiRemain || 0) : 0;
      return !!sl.zashikiEnabled && z > 0;
    }
    function canCounter(sl) {
      return Number(sl.counterRemain || 0) > 0;
    }
    function canTable(people, sl) {
      const p = Number(people || 1);
      const t2 = Number(sl.table2Remain || 0);
      const tl = Number(sl.tableLargeRemain || 0);
      const z = sl.zashikiEnabled ? Number(sl.zashikiRemain || 0) : 0;

      if (p <= 2) return (t2 > 0) || (tl > 0);
      if (p <= 6) return (tl > 0);
      return !!sl.zashikiEnabled && z > 0; // 7+ 縺ｯ蠎ｧ謨ｷ縺ｸ
    }
    function canEither(people, sl) {
      const p = Number(people || 1);

      const can = {
        counter: canCounter(sl),
        table2: Number(sl.table2Remain || 0) > 0,
        tableLarge: Number(sl.tableLargeRemain || 0) > 0,
        zashiki: canZashiki(sl),
      };

      const order =
        p <= 2 ? ["table2","counter","tableLarge","zashiki"]
        : p <= 6 ? ["tableLarge","zashiki","counter","table2"]
        : ["zashiki","tableLarge","counter","table2"];

      for (const t of order) {
        if (t === "zashiki" && !sl.zashikiEnabled) continue;
        if (can[t]) return true;
      }
      return false;
    }

    function isCurrentSlot(sl) {
      return !!currentReservation
        && $date.value === currentReservation.date
        && sl.time === currentReservation.time;
    }

    function slotDisabled(sl) {
      // 縲檎樟蝨ｨ縺ｮ莠育ｴ・棧縲阪・貅蟶ｭ陦ｨ遉ｺ縺ｧ繧る∈縺ｹ繧九ｈ縺・↓縺吶ｋ・医Γ繝｢縺縺大､画峩縺励◆縺・凾縺ｫ隧ｰ縺ｾ縺ｪ縺・◆繧・ｼ・      if (isCurrentSlot(sl)) return false;

      const pref = $seatPref.value;
      const p = totalPeople();

      if (pref === "counter") return !canCounter(sl);
      if (pref === "zashiki") return !canZashiki(sl);
      if (pref === "table")   return !canTable(p, sl);
      return !canEither(p, sl);
    }

    function slotLabel(sl) {
      const pref = $seatPref.value;
      const p = totalPeople();

      let ok = false;
      if (isCurrentSlot(sl)) ok = true;
      else if (pref === "counter") ok = canCounter(sl);
      else if (pref === "zashiki") ok = canZashiki(sl);
      else if (pref === "table") ok = canTable(p, sl);
      else ok = canEither(p, sl);

      if (pref === "zashiki" && !sl.zashikiEnabled) return `${sl.time}・亥ｺｧ謨ｷ・壼女莉伜●豁｢・荏;
      if (isCurrentSlot(sl)) return `${sl.time}・育樟蝨ｨ縺ｮ莠育ｴ・ｼ荏;
      return `${sl.time}・・{ok ? "莠育ｴ・庄" : "貅蟶ｭ"}・荏;
    }

    function renderTimes() {
      $time.innerHTML = "";

      if (!availability) {
        const opt = document.createElement("option");
        opt.textContent = "隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ窶ｦ";
        $time.appendChild(opt);
        return;
      }

      if (availability.closed) {
        $timeHelp.textContent = availability.reason || "莨第･ｭ譌･縺ｮ縺溘ａ莠育ｴ・〒縺阪∪縺帙ｓ縲・;
        $update.disabled = true;
        $time.disabled = true;
        return;
      }

      $time.disabled = false;

      let enabledCount = 0;
      const slots = availability.slots || [];
      for (const sl of slots) {
        const opt = document.createElement("option");
        opt.value = sl.time;
        opt.textContent = slotLabel(sl);
        opt.disabled = slotDisabled(sl);
        if (!opt.disabled) enabledCount++;
        $time.appendChild(opt);
      }

      if (enabledCount === 0) {
        $timeHelp.textContent = "縺薙・譚｡莉ｶ縺ｧ縺ｯ貅蟶ｭ縺ｧ縺吶よ律莉倥・莠ｺ謨ｰ繝ｻ蟶ｭ蟶梧悍繧貞､峨∴縺ｦ縺上□縺輔＞縲・;
        $update.disabled = true;
      } else {
        $timeHelp.textContent = "";

        // 邱蛻・Ο繝・け荳ｭ縺ｯ蟶ｸ縺ｫ譖ｴ譁ｰ荳榊庄
        $update.disabled = deadlineLocked;

        // 譌｢蟄倥・莠育ｴ・凾蛻ｻ繧貞━蜈・        const cur = currentReservation?.time;
        if (cur) {
          const curOpt = [...$time.options].find(o => o.value === cur);
          if (curOpt) $time.value = cur;
        }

        // 驕ｸ謚樔ｸｭ縺ｮ蛟､縺檎┌蜉ｹ縺ｪ繧画怙蛻昴・譛牙柑譫縺ｸ
        const curOpt2 = [...$time.options].find(o => o.value === $time.value);
        if (!curOpt2 || curOpt2.disabled) {
          const firstEnabled = [...$time.options].find(o => !o.disabled);
          if (firstEnabled) $time.value = firstEnabled.value;
        }
      }
    }

    async function loadAvailability() {
      const ymd = $date.value;

      if (isWeekendYmd(ymd)) {
        alert("蝨滓律縺ｯ莨代∩縺ｧ縺吶ょｹｳ譌･繧帝∈繧薙〒縺上□縺輔＞縲・);
        const fixed = nextWeekdayYmd(ymd);
        if (fp) fp.setDate(fixed, true);
        else $date.value = fixed;
        return;
      }

      $timeHelp.textContent = "隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ窶ｦ";
      $update.disabled = true;
      availability = null;
      renderTimes();

      try {
        availability = await Hidakko.api(`/availability?date=${encodeURIComponent($date.value)}`);
        renderTimes();
      } catch (e) {
        console.error(e);
        availability = null;
        $timeHelp.textContent = "遨ｺ蟶ｭ迥ｶ豕√・蜿門ｾ励↓螟ｱ謨励＠縺ｾ縺励◆縲・;
        $update.disabled = true;
        renderTimes();
      }
    }

    function buildLookupBody() {
      const raw = ($rid.value || "").trim();
      const phone = normalizePhone($phone.value);

      // 謨ｰ蟄・縲・譯√・縲御ｺ育ｴ・分蜿ｷ・・ode・峨阪→縺励※謇ｱ縺・ゅ◎繧御ｻ･螟悶・縲梧立ID縲阪→縺励※謇ｱ縺・・      const isCode = /^\d{4,6}$/.test(raw);

      if (isCode) return { code: raw, phone };
      return { id: raw, phone };
    }

    async function lookup() {
      $lookup.disabled = true;
      $lookup.textContent = "隱ｭ縺ｿ霎ｼ縺ｿ荳ｭ窶ｦ";

      try {
        const bodyObj = buildLookupBody();
        if ((!bodyObj.code && !bodyObj.id) || !bodyObj.phone) {
          alert("莠育ｴ・分蜿ｷ縺ｨ髮ｻ隧ｱ逡ｪ蜿ｷ繧貞・蜉帙＠縺ｦ縺上□縺輔＞縲・);
          return;
        }

        const r = await Hidakko.api("/reservations/lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyObj)
        });

        currentReservation = r;
        $detail.style.display = "";
        $statusBox.textContent = statusText(r);

        // 蛟､蜿肴丐
        if (fp) fp.setDate(r.date, false);
        $date.value = r.date;

        $seatPref.value = r.seatPref || "either";
        // 螟ｧ莠ｺ/蟄蝉ｾ幢ｼ域眠・・竊・辟｡縺代ｌ縺ｰ people・域立・峨〒蠕ｩ蜈・        const aRaw = (r && (r.adults ?? r.adult ?? r.adultCount));
        const cRaw = (r && (r.children ?? r.child ?? r.childCount));

        const aNum = Number(aRaw);
        const cNum = Number(cRaw);

        if (Number.isFinite(aNum) || Number.isFinite(cNum)) {
          $adult.value = String(Math.max(1, Number.isFinite(aNum) ? aNum : (Number(r.people || 1) || 1)));
          $child.value = String(Math.max(0, Number.isFinite(cNum) ? cNum : 0));
        } else {
          $adult.value = String(Math.max(1, Number(r.people || 2) || 2));
          $child.value = "0";
        }
        clampPeopleInputs();
        $note.value = r.note || "";

        // 螟画峩譛滄剞・・譌･蜑搾ｼ牙愛螳夲ｼ壼・縺ｮ莠育ｴ・律蝓ｺ貅・        deadlineLocked = !canChange(r.date);
        if (deadlineLocked) {
          $statusBox.textContent += " / 窶ｻ 螟画峩譛滄剞・・譌･蜑搾ｼ峨ｒ驕弱℃縺ｦ縺・∪縺吶・;
          setEditable(false);
        } else {
          setEditable(true);
        }

        await loadAvailability();

        // 譎ょ綾縺ｮ譌｢螳壼､・井ｺ育ｴ・凾蛻ｻ繧貞━蜈茨ｼ・        if (r.time) $time.value = r.time;
        renderTimes();

      } catch (e) {
        console.error(e);
        alert(e.message || "隕九▽縺九ｊ縺ｾ縺帙ｓ縺ｧ縺励◆");
      } finally {
        $lookup.disabled = false;
        $lookup.textContent = "遒ｺ隱・;
      }
    }

    $lookup.addEventListener("click", lookup);
    $seatPref.addEventListener("change", renderTimes);
    $adult.addEventListener("input", () => { clampPeopleInputs(); renderTimes(); });
    $child.addEventListener("input", () => { clampPeopleInputs(); renderTimes(); });
    $adult.addEventListener("change", () => { clampPeopleInputs(); renderTimes(); });
    $child.addEventListener("change", () => { clampPeopleInputs(); renderTimes(); });

    $update.addEventListener("click", async () => {
      if (!currentReservation) return;

      if (deadlineLocked) {
        alert("螟画峩譛滄剞・・譌･蜑搾ｼ峨ｒ驕弱℃縺ｦ縺・∪縺吶ゅく繝｣繝ｳ繧ｻ繝ｫ縺ｯ縺企崕隧ｱ縺ｧ縺企｡倥＞縺励∪縺吶・);
        return;
      }
      if (isWeekendYmd($date.value)) {
        alert("蝨滓律縺ｯ莨代∩縺ｧ縺吶ょｹｳ譌･繧帝∈繧薙〒縺上□縺輔＞縲・);
        return;
      }

      if (!$date.value) { alert("譌･莉倥ｒ驕ｸ繧薙〒縺上□縺輔＞縲・); return; }
      if (!$time.value) { alert("譎る俣繧帝∈繧薙〒縺上□縺輔＞縲・); return; }
      const pc = clampPeopleInputs();
      if (pc.adults < 1) { alert("螟ｧ莠ｺ縺ｯ1莉･荳翫〒蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }
      if (pc.children < 0) { alert("蟄蝉ｾ帙・0莉･荳翫〒蜈･蜉帙＠縺ｦ縺上□縺輔＞縲・); return; }

      $update.disabled = true;
      $update.textContent = "騾∽ｿ｡荳ｭ窶ｦ";

      try {
        await Hidakko.api(`/reservations/${encodeURIComponent(currentReservation.id)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: normalizePhone($phone.value),
            date: $date.value,
            time: $time.value,
            people: totalPeople(),
            adults: clampPeopleInputs().adults,
            children: clampPeopleInputs().children,
            seatPref: $seatPref.value,
            note: $note.value
          })
        });

        alert("螟画峩繧貞女縺台ｻ倥￠縺ｾ縺励◆縲ょ・謇ｿ隱阪→縺ｪ繧翫∪縺吶・);
        await lookup();
      } catch (e) {
        console.error(e);
        alert(e.message || "螟画峩縺ｫ螟ｱ謨励＠縺ｾ縺励◆");
      } finally {
        $update.textContent = "螟画峩繧帝∽ｿ｡・亥・謇ｿ隱搾ｼ・;
        $update.disabled = deadlineLocked;
      }
    });

    // ====== flatpickr 蛻晄悄蛹厄ｼ亥悄譌･辟｡蜉ｹ・・=====
    (function initDatePicker(){
      const today = jstTodayYmd();
      const initial = isWeekendYmd(today) ? nextWeekdayYmd(today) : today;

      fp = flatpickr($date, {
        dateFormat: "Y-m-d",
        defaultDate: initial,
        minDate: "today",
        disable: [ function(date){ return isWeekendDateObj(date); } ],
        onChange: function() {
          if ($detail.style.display === "none") return; // 莠育ｴ・ｒ髢九￥蜑阪・菴輔ｂ縺励↑縺・          loadAvailability();
        }
      });
    })();

    // done.html 縺九ｉ #code= 縺ｧ鬟帙ｓ縺ｧ縺上ｋ蝣ｴ蜷茨ｼ域立 #id= 繧よ舞縺・ｼ・    (function initHash(){
      const hash = location.hash || "";
      if (hash.startsWith("#code=")) {
        $rid.value = decodeURIComponent(hash.slice(6));
      } else if (hash.startsWith("#id=")) {
        $rid.value = decodeURIComponent(hash.slice(4));
      }
    })();
  </script>
</body>
</html>
